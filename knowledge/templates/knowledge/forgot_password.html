<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Things Nobody Told Me</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 12px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .message {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 15px;
            }

            input,
            button {
                min-height: 50px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter the email address associated with your account.
            We'll send you a password reset link.
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="back">

            <a href="{% url 'login' %}">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
