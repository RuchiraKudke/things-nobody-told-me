{% extends "base.html" %}

{% block title %}
Password Reset Complete | Things Nobody Told Me
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Password Reset Successful</h1>

        <p class="auth-subtitle">

            Your password has been changed successfully.

        </p>

        <p>

            You can now login using your new password.

        </p>


        <a
            href="{% url 'login' %}"
            class="auth-button"
        >
            Login Now
        </a>

    </div>

</div>

{% endblock %}
