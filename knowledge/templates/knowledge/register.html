<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register | Things Nobody Told Me
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f3ef;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .auth-container {
            width: 100%;

            max-width: 460px;
        }

        .auth-card {
            background: white;

            padding: 42px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;

            color: #222;

            margin: 0 0 10px;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        .message {
            padding: 12px 15px;

            border-radius: 8px;

            background: #ffe8e8;

            color: #a00000;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .message.success {
            background: #e8f8ec;

            color: #176b2c;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5d5d5;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .register-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #444;
        }

        .bottom-text {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }

        .bottom-text a {
            color: #222;

            font-weight: 600;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Things Nobody Told Me and share useful knowledge.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
