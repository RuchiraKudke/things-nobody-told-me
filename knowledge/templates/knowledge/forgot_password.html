<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Things Nobody Told Me</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            font-size: 30px;
        }

        .subtitle {
            color: #666;
            line-height: 1.5;

            margin-bottom: 30px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #222;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #222;

            text-decoration: none;

            font-weight: bold;
        }

        @media (max-width: 500px) {

            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <h1>
            Forgot Password?
        </h1>

        <p class="subtitle">
            Enter your registered email address and we'll help you reset your password.
        </p>


        <form method="POST">

            {% csrf_token %}

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>


        <a href="{% url 'login' %}" class="back">
            ← Back to Login
        </a>

    </div>

</body>

</html>
