<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Things Nobody Told Me
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f3ef;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;

            max-width: 450px;
        }

        .card {
            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;

            color: #222;

            margin: 0 0 12px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            line-height: 1.5;

            margin-bottom: 28px;
        }

        .message {
            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;

            background: #ffe8e8;

            color: #a00000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            text-align: center;

            margin-top: 24px;
        }

        .back a {
            color: #222;

            font-weight: 600;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>
            Forgot Password?
        </h1>

        <p class="subtitle">
            Enter your registered email address.
            We'll send you a password reset link.
        </p>


        {% if form.errors %}

            <div class="message">
                Please enter a valid email address.
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="id_email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="id_email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <button type="submit">
                Send Reset Link
            </button>

        </form>


        <div class="back">

            <a href="{% url 'login' %}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
