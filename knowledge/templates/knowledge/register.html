<!DOCTYPE html>
<html>

<head>

    <title>Register - Things Nobody Told Me</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* REGISTER CARD */

        .register-container {
            width: 400px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }


        /* HEADING */

        h1 {
            text-align: center;

            margin-bottom: 28px;

            color: #222;

            font-size: 28px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #444;

            font-weight: 600;

            font-size: 14px;
        }


        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        input:focus {
            border-color: #555;

            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }


        /* BUTTON */

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 5px;
        }


        button:hover {
            background: #444;
        }


        /* ERROR / SUCCESS MESSAGE */

        .message {
            background: #ffe5e5;

            color: #b00020;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }


        /* LOGIN LINK */

        .bottom-text {
            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }


        .bottom-text a {
            color: #222;

            font-weight: bold;

            text-decoration: none;

            margin-left: 5px;
        }


        .bottom-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="register-container">


        <h1>
            Create Your Account
        </h1>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit">
                Create Account
            </button>


        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>


    </div>


</body>

</html>
