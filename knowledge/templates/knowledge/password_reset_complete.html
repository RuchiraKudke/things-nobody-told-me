<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Changed - Things Nobody Told Me</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #444;
        }

        @media (max-width: 500px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            ✅
        </div>

        <h1>
            Password Changed Successfully
        </h1>

        <p>
            Your password has been updated successfully.
            You can now log in using your new password.
        </p>

        <a href="{% url 'login' %}" class="button">
            Login Now
        </a>

    </div>

</body>

</html>
