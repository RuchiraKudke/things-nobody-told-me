<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Sent | Things Nobody Told Me</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: #191922;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        .login-link {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #8b6cff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">📧</div>

    <h1>Check Your Email</h1>

    <p>
        If an account exists with the email address you entered,
        a password reset link has been sent to that email address.
    </p>

    <p>
        Please check your inbox and spam folder.
    </p>

    <a href="{% url 'login' %}" class="login-link">
        Back to Login
    </a>

</div>

</body>
</html>
