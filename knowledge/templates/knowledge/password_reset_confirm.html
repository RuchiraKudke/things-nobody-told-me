<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Things Nobody Told Me
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f3ef;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }

        .container {
            width: 100%;

            max-width: 450px;
        }

        .card {
            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;

            color: #222;

            margin-top: 0;
        }

        .subtitle {
            text-align: center;

            color: #777;

            line-height: 1.5;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .errors {
            background: #ffe8e8;

            color: #a00000;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        .errorlist {
            margin: 5px 0;

            padding-left: 20px;
        }

        .invalid {
            text-align: center;
        }

        .invalid a {
            color: #222;

            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        {% if validlink %}

            <h1>
                Create New Password
            </h1>

            <p class="subtitle">
                Enter your new password below.
            </p>


            {% if form.errors %}

                <div class="errors">
                    {{ form.errors }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="id_new_password1">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password1"
                        id="id_new_password1"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="id_new_password2">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="new_password2"
                        id="id_new_password2"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button type="submit">
                    Reset Password
                </button>

            </form>

        {% else %}

            <div class="invalid">

                <h1>
                    Invalid Link
                </h1>

                <p class="subtitle">
                    This password reset link is invalid or has already
                    been used.
                </p>

                <a href="{% url 'password_reset' %}">
                    Request a new reset link
                </a>

            </div>

        {% endif %}

    </div>

</div>

</body>

</html>
