<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Password Reset | Things Nobody Told Me
    </title>

    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f3ef;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }

        .card {
            width: 100%;

            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        h1 {
            color: #222;
        }

        p {
            color: #777;

            line-height: 1.6;
        }

        .button {
            display: inline-block;

            margin-top: 20px;

            padding: 13px 28px;

            background: #222;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="icon">
        ✅
    </div>

    <h1>
        Password Reset Successful
    </h1>

    <p>
        Your password has been successfully changed.
    </p>

    <p>
        You can now login using your new password.
    </p>

    <a
        href="{% url 'login' %}"
        class="button"
    >
        Login Now
    </a>

</div>

</body>

</html>
