<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset - Things Nobody Told Me</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 18px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .login-btn {
            display: inline-block;

            background: #222;
            color: white;

            padding: 13px 24px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #444;
        }

        @media (max-width: 500px) {

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 15px;
            }

            .icon {
                font-size: 45px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            📧
        </div>

        <h1>
            Check Your Email
        </h1>

        <p>
            If an account exists with the email address you entered,
            we have sent instructions to reset your password.
        </p>

        <p>
            Please check your inbox and follow the password reset link.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Back to Login
        </a>

    </div>

</body>

</html>
